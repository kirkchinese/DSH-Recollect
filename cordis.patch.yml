# Bundle patch: mounts Recollect once at host level so every agent (all
# presets and subagents) gets instruction files and persistent memory.
# Override `config` in your profile's cordis.patch.yml (id: recollect); an
# override replaces the whole config object.
- insert:
    - id: recollect
      name: '@kirkchinese/dsh-recollect'
    # One host instance follows composed presets, including live switches. It
    # also registers the Free Claude preset at runtime as a live copy of the
    # host's standard preset, so DSH component changes never break it.
    - id: free-claude
      name: '@kirkchinese/dsh-recollect/free-claude'
